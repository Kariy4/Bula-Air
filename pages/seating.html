<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Seating | Bula Air</title>
  <link rel="icon" href="../assets/images/branding/hibiscus.svg" type="image/svg+xml">
  <link rel="shortcut icon" href="../assets/images/branding/hibiscus.svg">
  <link rel="mask-icon" href="../assets/images/branding/hibiscus.svg" color="#2468e8">
  <link rel="stylesheet" href="../assets/css/style.css">
  <link rel="stylesheet" href="../assets/css/polish.css">
</head>
<body data-page="seating">
  <header class="site-header">
    <div class="container nav-shell">
      <a class="brand brand-logo" href="index.html" aria-label="Bula Air home"><img src="../assets/images/branding/bula-air-logo.png" alt="Bula Air logo"><small>The wings of Fiji.</small></a>
      <nav class="nav-links" aria-label="Main navigation"><a href="index.html">Home</a><a href="booking.html">Book</a><a href="routes.html">Routes</a><a href="fleet.html">Fleet</a><a href="seating.html" aria-current="page">Seating</a><a href="classes.html">Classes</a><a href="about.html">About</a></nav>

  </header>
  <main class="container page">
    <p class="eyebrow">Seat selection</p>
    <h1>Preview any Bula Air aircraft layout.</h1>
    <section class="tool-panel">
      <div class="control-row">
        <label><span>Aircraft</span><select id="aircraft-select" class="input"></select></label>
        <div class="selection-summary" aria-live="polite">Selected seats: <strong id="selected-count">0</strong></div>

      <div id="seat-map" class="seat-map" aria-label="Aircraft seating map"></div>
      <div class="legend" aria-label="Seat legend"><span><i class="legend-seat available"></i>Available</span><span><i class="legend-seat selected"></i>Selected</span><span><i class="legend-seat occupied"></i>Occupied</span></div>
    </section>
  </main>
