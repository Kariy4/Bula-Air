<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Select Your Seat | Bula Air</title>

    <link rel="icon"
          href="../assets/images/branding/hibiscus.svg"
          type="image/svg+xml">

    <link rel="stylesheet" href="../assets/css/style.css">
    <link rel="stylesheet" href="../assets/css/polish.css">

    <style>

        :root {
            --seat-blue: #2468e8;
            --seat-blue-dark: #1550c5;
            --seat-navy: #071936;
            --seat-muted: #66758a;
            --seat-line: #d7e4ee;
            --seat-bg: #f4f8fb;
            --seat-occupied: #9aa7b5;
        }

        body {
            background:
                radial-gradient(
                    circle at top,
                    rgba(185, 221, 255, .35),
                    transparent 35%
                ),
                #f5f9fc;
        }

        .seat-page {
            width: min(1250px, calc(100% - 32px));
            margin: 0 auto;
            padding: 45px 0 80px;
        }

        /* --------------------------------
           HEADER
        -------------------------------- */

        .seat-header {
            margin-bottom: 28px;
        }

        .seat-header h1 {
            margin: 0 0 8px;
            font-size: clamp(2rem, 4vw, 3rem);
            color: var(--seat-navy);
        }

        .seat-header p {
            margin: 0;
            color: var(--seat-muted);
        }

        /* --------------------------------
           TOP SUMMARY
        -------------------------------- */

        .booking-summary {
            display: grid;
            grid-template-columns: 1.3fr 1fr 1fr 1fr;
            gap: 1px;
            background: var(--seat-line);
            border: 1px solid var(--seat-line);
            border-radius: 18px;
            overflow: hidden;
            margin-bottom: 30px;
            box-shadow: 0 12px 35px rgba(7, 25, 54, .07);
        }

        .summary-item {
            background: white;
            padding: 20px;
        }

        .summary-label {
            display: block;
            color: var(--seat-muted);
            font-size: .72rem;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: .08em;
            margin-bottom: 5px;
        }

        .summary-value {
            color: var(--seat-navy);
            font-weight: 800;
        }

        .summary-route {
            font-size: 1.2rem;
        }

        /* --------------------------------
           MAIN AREA
        -------------------------------- */

        .seat-content {
            display: grid;
            grid-template-columns: minmax(0, 1fr) 310px;
            gap: 28px;
            align-items: start;
        }

        /* --------------------------------
           AIRCRAFT
        -------------------------------- */

        .aircraft-panel {
            background: white;
            border: 1px solid var(--seat-line);
            border-radius: 25px;
            padding: 30px;
            box-shadow: 0 15px 45px rgba(7, 25, 54, .08);
        }

        .aircraft-panel-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 20px;
            margin-bottom: 25px;
        }

        .aircraft-panel-header h2 {
            margin: 0;
            color: var(--seat-navy);
        }

        .aircraft-name {
            color: var(--seat-muted);
            font-size: .9rem;
            margin-top: 4px;
        }

        .cabin-badge {
            background: #edf5ff;
            color: var(--seat-blue-dark);
            padding: 8px 13px;
            border-radius: 999px;
            font-size: .78rem;
            font-weight: 800;
            white-space: nowrap;
        }

        /* --------------------------------
           AIRCRAFT BODY
        -------------------------------- */

        .aircraft-body {
            width: min(650px, 100%);
            margin: auto;
            background:
                linear-gradient(
                    90deg,
                    #e8eef3,
                    #f9fbfd 10%,
                    #ffffff 50%,
                    #f9fbfd 90%,
                    #e8eef3
                );
            border: 1px solid #d5e0e8;
            border-radius: 48px 48px 30px 30px;
            padding: 34px 28px 40px;
            box-shadow:
                inset 0 0 30px rgba(7, 25, 54, .05),
                0 12px 30px rgba(7, 25, 54, .06);
        }

        .aircraft-nose {
            text-align: center;
            color: var(--seat-muted);
            font-size: .72rem;
            font-weight: 900;
            letter-spacing: .15em;
            margin-bottom: 25px;
        }

        .aircraft-nose::before {
            content: "✦";
            display: block;
            color: var(--seat-blue);
            font-size: 1.3rem;
            margin-bottom: 4px;
        }

        .cabin-section {
            margin-bottom: 25px;
        }

        .cabin-section:last-child {
            margin-bottom: 0;
        }

        .cabin-title {
            text-align: center;
            color: var(--seat-navy);
            font-size: .7rem;
            font-weight: 900;
            letter-spacing: .12em;
            text-transform: uppercase;
            margin-bottom: 12px;
        }

        .seat-row {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 7px;
            margin-bottom: 7px;
        }

        .seat-row-number {
            width: 25px;
            color: #8493a3;
            font-size: .68rem;
            font-weight: 800;
            text-align: center;
            flex-shrink: 0;
        }

        .seat-group {
            display: flex;
            gap: 5px;
        }

        .seat-group + .seat-group {
            margin-left: 20px;
        }

        /* --------------------------------
           SEATS
        -------------------------------- */

        .seat {
            width: 38px;
            height: 38px;
            padding: 0;
            border: 1px solid #c8d5df;
            border-radius: 8px 8px 5px 5px;
            background: #fff;
            color: var(--seat-navy);
            font-size: .66rem;
            font-weight: 900;
            cursor: pointer;
            transition:
                transform .15s ease,
                background .15s ease,
                border-color .15s ease,
                box-shadow .15s ease;
        }

        .seat:hover:not(:disabled) {
            transform: translateY(-2px);
            border-color: var(--seat-blue);
            box-shadow: 0 5px 12px rgba(36, 104, 232, .18);
        }

        .seat.selected {
            background: var(--seat-blue);
            color: white;
            border-color: var(--seat-blue-dark);
            box-shadow: 0 5px 15px rgba(36, 104, 232, .3);
            transform: translateY(-2px);
        }

        .seat.occupied {
            background: var(--seat-occupied);
            border-color: #8996a3;
            color: white;
            cursor: not-allowed;
        }

        .seat.premium {
            background: #eef8ff;
            border-color: #79b4ea;
        }

        .seat.business {
            background: #f2f1ff;
            border-color: #aaa6dc;
        }

        .seat.first {
            background: #fff8e5;
            border-color: #d8bd69;
        }

        .seat.selected.premium,
        .seat.selected.business,
        .seat.selected.first {
            background: var(--seat-blue);
            border-color: var(--seat-blue-dark);
            color: white;
        }

        /* --------------------------------
           SIDE PANEL
        -------------------------------- */

        .seat-sidebar {
            display: flex;
            flex-direction: column;
            gap: 18px;
        }

        .sidebar-card {
            background: white;
            border: 1px solid var(--seat-line);
            border-radius: 20px;
            padding: 22px;
            box-shadow: 0 12px 30px rgba(7, 25, 54, .06);
        }

        .sidebar-card h3 {
            margin: 0 0 17px;
            color: var(--seat-navy);
        }

        .legend {
            display: grid;
            gap: 12px;
        }

        .legend-item {
            display: flex;
            align-items: center;
            gap: 10px;
            color: var(--seat-muted);
            font-size: .82rem;
            font-weight: 600;
        }

        .legend-seat {
            width: 27px;
            height: 27px;
            border-radius: 6px;
            border: 1px solid #c8d5df;
            background: white;
            flex-shrink: 0;
        }

        .legend-seat.selected {
            background: var(--seat-blue);
            border-color: var(--seat-blue-dark);
        }

        .legend-seat.occupied {
            background: var(--seat-occupied);
            border-color: #8996a3;
        }

        .legend-seat.premium {
            background: #eef8ff;
            border-color: #79b4ea;
        }

        .legend-seat.business {
            background: #f2f1ff;
            border-color: #aaa6dc;
        }

        .legend-seat.first {
            background: #fff8e5;
            border-color: #d8bd69;
        }

        .selected-card {
            background:
                linear-gradient(
                    145deg,
                    #071936,
                    #123d82
                );
            border: none;
            color: white;
        }

        .selected-card h3 {
            color: white;
        }

        .selected-seat-display {
            font-size: 2.3rem;
            font-weight: 900;
            margin: 5px 0;
        }

        .selected-seat-info {
            color: rgba(255,255,255,.72);
            font-size: .82rem;
        }

        /* --------------------------------
           ACTIONS
        -------------------------------- */

        .seat-actions {
            margin-top: 28px;
            display: flex;
            justify-content: flex-end;
            gap: 12px;
        }

        .continue-button {
            min-width: 190px;
            min-height: 50px;
            border: none;
            border-radius: 12px;
            background: var(--seat-blue);
            color: white;
            font-size: .95rem;
            font-weight: 800;
            cursor: pointer;
            padding: 0 25px;
            transition: background .15s ease, transform .15s ease;
        }

        .continue-button:hover:not(:disabled) {
            background: var(--seat-blue-dark);
            transform: translateY(-1px);
        }

        .continue-button:disabled {
            opacity: .45;
            cursor: not-allowed;
        }

        .back-button {
            min-height: 50px;
            border: 1px solid var(--seat-line);
            border-radius: 12px;
            background: white;
            color: var(--seat-navy);
            font-weight: 800;
            padding: 0 22px;
            cursor: pointer;
        }

        /* --------------------------------
           MESSAGE
        -------------------------------- */

        .seat-message {
            padding: 18px;
            border-radius: 14px;
            background: #fff3f3;
            color: #a42b2b;
            border: 1px solid #f0cccc;
            margin-bottom: 20px;
            font-weight: 600;
        }

        /* --------------------------------
           RESPONSIVE
        -------------------------------- */

        @media (max-width: 950px) {

            .seat-content {
                grid-template-columns: 1fr;
            }

            .seat-sidebar {
                display: grid;
                grid-template-columns: 1fr 1fr;
            }

        }

        @media (max-width: 700px) {

            .booking-summary {
                grid-template-columns: 1fr 1fr;
            }

            .aircraft-panel {
                padding: 18px 10px;
            }

            .aircraft-body {
                padding: 25px 8px 30px;
                border-radius: 35px 35px 22px 22px;
            }

            .seat {
                width: 31px;
                height: 34px;
                font-size: .57rem;
            }

            .seat-group + .seat-group {
                margin-left: 10px;
            }

            .seat-row {
                gap: 3px;
            }

            .seat-group {
                gap: 3px;
            }

            .seat-row-number {
                width: 18px;
            }

            .seat-sidebar {
                grid-template-columns: 1fr;
            }

        }

        @media (max-width: 480px) {

            .seat-page {
                width: min(100% - 20px, 1250px);
                padding-top: 25px;
            }

            .booking-summary {
                grid-template-columns: 1fr;
            }

            .summary-item {
                padding: 14px 17px;
            }

            .seat {
                width: 26px;
                height: 31px;
                font-size: .5rem;
            }

            .seat-group + .seat-group {
                margin-left: 6px;
            }

            .aircraft-body {
                padding-left: 4px;
                padding-right: 4px;
            }

            .seat-actions {
                flex-direction: column-reverse;
            }

            .continue-button,
            .back-button {
                width: 100%;
            }

        }

    </style>
</head>

<body>

<main class="seat-page">

    <header class="seat-header">

        <p class="eyebrow">
            Bula Air • Seat Selection
        </p>

        <h1>Select your seat</h1>

        <p>
            Choose the seat you'd like for your journey.
        </p>

    </header>


    <!-- BOOKING SUMMARY -->

    <section
        id="booking-summary"
        class="booking-summary"
    ></section>


    <!-- ERROR -->

    <div
        id="seat-message"
        class="seat-message"
        hidden
    ></div>


    <section class="seat-content">


        <!-- AIRCRAFT -->

        <div class="aircraft-panel">

            <div class="aircraft-panel-header">

                <div>

                    <h2>
                        Seat map
                    </h2>

                    <div
                        id="aircraft-name"
                        class="aircraft-name"
                    >
                        Loading aircraft...
                    </div>

                </div>

                <div
                    id="cabin-badge"
                    class="cabin-badge"
                >
                    Economy
                </div>

            </div>


            <div class="aircraft-body">

                <div class="aircraft-nose">
                    FRONT OF AIRCRAFT
                </div>

                <div id="seat-map"></div>

            </div>


            <div class="seat-actions">

                <button
                    id="back-button"
                    class="back-button"
                    type="button"
                >
                    Back to booking
                </button>

                <button
                    id="continue-button"
                    class="continue-button"
                    type="button"
                    disabled
                >
                    Continue
                </button>

            </div>

        </div>


        <!-- SIDEBAR -->

        <aside class="seat-sidebar">


            <div class="sidebar-card">

                <h3>
                    Seat key
                </h3>

                <div class="legend">

                    <div class="legend-item">
                        <span class="legend-seat"></span>
                        Available
                    </div>

                    <div class="legend-item">
                        <span class="legend-seat selected"></span>
                        Selected
                    </div>

                    <div class="legend-item">
                        <span class="legend-seat occupied"></span>
                        Occupied
                    </div>

                    <div class="legend-item">
                        <span class="legend-seat premium"></span>
                        Premium Economy
                    </div>

                    <div class="legend-item">
                        <span class="legend-seat business"></span>
                        Business
                    </div>

                    <div class="legend-item">
                        <span class="legend-seat first"></span>
                        First / Suite
                    </div>

                </div>

            </div>


            <div
                id="selected-card"
                class="sidebar-card selected-card"
            >

                <h3>
                    Your seat
                </h3>

                <div
                    id="selected-seat"
                    class="selected-seat-display"
                >
                    —
                </div>

                <div
                    id="selected-seat-info"
                    class="selected-seat-info"
                >
                    Select a seat from the map.
                </div>

            </div>


        </aside>

    </section>

</main>


<script>

document.addEventListener("DOMContentLoaded", () => {

    /*
     * -----------------------------------------------------
     * LOAD BOOKING
     * -----------------------------------------------------
     */

    const rawBooking =
        localStorage.getItem("bulaAirBooking");

    if (!rawBooking) {

        showMessage(
            "Your booking session could not be found. Please start again."
        );

        setTimeout(() => {
            window.location.href = "booking.html";
        }, 1500);

        return;
    }


    let booking;

    try {

        booking = JSON.parse(rawBooking);

    } catch (error) {

        console.error(error);

        showMessage(
            "Your booking data is invalid. Please start the booking again."
        );

        return;
    }


    /*
     * -----------------------------------------------------
     * SUPPORT OLD + NEW BOOKING STRUCTURES
     * -----------------------------------------------------
     */

    const flight =
        booking.flight || booking;

    const aircraft =
        normaliseAircraft(
            flight.aircraft ||
            booking.aircraft ||
            "Airbus A320neo"
        );


    const cabin =
        booking.passenger?.cabin ||
        booking.cabin ||
        "economy";


    /*
     * -----------------------------------------------------
     * SUMMARY
     * -----------------------------------------------------
     */

    const summary =
        document.getElementById("booking-summary");

    const flightNumber =
        flight.flightNumber ||
        booking.flightNumber ||
        "Bula Air";

    const origin =
        flight.origin ||
        booking.from ||
        "";

    const destination =
        flight.destination ||
        booking.to ||
        "";

    const date =
        booking.date ||
        "";

    summary.innerHTML = `

        <div class="summary-item">

            <span class="summary-label">
                Flight
            </span>

            <div class="summary-value">
                ${escapeHtml(flightNumber)}
            </div>

        </div>

        <div class="summary-item">

            <span class="summary-label">
                Route
            </span>

            <div class="summary-value summary-route">
                ${escapeHtml(origin)}
                →
                ${escapeHtml(destination)}
            </div>

        </div>

        <div class="summary-item">

            <span class="summary-label">
                Departure
            </span>

            <div class="summary-value">
                ${escapeHtml(
                    flight.departure || "—"
                )}
            </div>

        </div>

        <div class="summary-item">

            <span class="summary-label">
                Aircraft
            </span>

            <div class="summary-value">
                ${escapeHtml(aircraft)}
            </div>

        </div>

    `;


    document.getElementById("aircraft-name")
        .textContent = aircraft;

    document.getElementById("cabin-badge")
        .textContent = cabinName(cabin);


    /*
     * -----------------------------------------------------
     * AIRCRAFT CONFIGURATION
     * -----------------------------------------------------
     *
     * groups:
     *
     * ["A", "B", "C"]
     * aisle
     * ["D", "E", "F"]
     *
     * This makes the actual aisle visually appear.
     */

    const AIRCRAFT_CONFIGS = {

        "Airbus A220-300": {

            rows: 20,

            groups: [
                ["A", "B"],
                ["C", "D"]
            ]

        },

        "Airbus A320neo": {

            rows: 30,

            groups: [
                ["A", "B", "C"],
                ["D", "E", "F"]
            ]

        },

        "Airbus A321neo": {

            rows: 34,

            groups: [
                ["A", "B", "C"],
                ["D", "E", "F"]
            ]

        },

        "Airbus A321-200": {

            rows: 30,

            groups: [
                ["A", "B", "C"],
                ["D", "E", "F"]
            ]

        },

        "Airbus A330-900": {

            rows: 38,

            groups: [
                ["A", "B", "C"],
                ["D", "E", "F"],
                ["G", "H", "J"]
            ]

        },

        "Airbus A350-900": {

            rows: 42,

            groups: [
                ["A", "B", "C"],
                ["D", "E", "F"],
                ["G", "H", "J"]
            ]

        },

        "Airbus A350-1000": {

            rows: 44,

            groups: [
                ["A", "B", "C"],
                ["D", "E", "F"],
                ["G", "H", "J"]
            ]

        },

        "Airbus A350-1000ULR": {

            rows: 40,

            groups: [
                ["A", "B", "C"],
                ["D", "E", "F"],
                ["G", "H", "J"]
            ]

        },

        "Boeing 777-9": {

            rows: 45,

            groups: [
                ["A", "B", "C"],
                ["D", "E", "F", "G"],
                ["H", "J", "K"]
            ]

        },

        "Airbus A380-800": {

            rows: 55,

            groups: [
                ["A", "B", "C"],
                ["D", "E", "F", "G"],
                ["H", "J", "K"]
            ]

        },

        "ATR 72-600": {

            rows: 18,

            groups: [
                ["A", "B"],
                ["C", "D"]
            ]

        }

    };


    /*
     * -----------------------------------------------------
     * CABIN CONFIG
     * -----------------------------------------------------
     */

    const CABIN_CONFIG = {

        economy: {
            start: 1,
            endRatio: 1,
            groups: null,
            style: "economy"
        },

        "premium-economy": {
            start: 1,
            endRatio: .22,
            groups: null,
            style: "premium"
        },

        business: {
            start: 1,
            endRatio: .16,
            groups: null,
            style: "business"
        },

        first: {
            start: 1,
            endRatio: .10,
            groups: null,
            style: "first"
        }

    };


    /*
     * -----------------------------------------------------
     * CHOOSE CONFIG
     * -----------------------------------------------------
     */

    const config =
        AIRCRAFT_CONFIGS[aircraft] ||
        AIRCRAFT_CONFIGS["Airbus A320neo"];


    /*
     * -----------------------------------------------------
     * OCCUPIED SEATS
     * -----------------------------------------------------
     *
     * Deterministic occupied seats based on flight.
     *
     * This means refreshing doesn't randomly move
     * occupied seats around.
     */

    const occupiedSeats =
        generateOccupiedSeats(
            config,
            flightNumber
        );


    /*
     * -----------------------------------------------------
     * SELECTED SEAT
     * -----------------------------------------------------
     */

    let selectedSeat =
        booking.seat ||
        (Array.isArray(booking.seats)
            ? booking.seats[0]
            : null);


    /*
     * If existing seat is occupied,
     * remove it.
     */

    if (selectedSeat &&
        occupiedSeats.includes(selectedSeat)) {

        selectedSeat = null;
    }


    /*
     * -----------------------------------------------------
     * RENDER
     * -----------------------------------------------------
     */

    renderSeatMap();


    /*
     * -----------------------------------------------------
     * RENDER SEAT MAP
     * -----------------------------------------------------
     */

    function renderSeatMap() {

        const map =
            document.getElementById("seat-map");

        map.innerHTML = "";


        const sections =
            buildCabinSections();


        sections.forEach(section => {

            const sectionElement =
                document.createElement("section");

            sectionElement.className =
                "cabin-section";


            const title =
                document.createElement("div");

            title.className =
                "cabin-title";

            title.textContent =
                section.name;

            sectionElement.appendChild(title);


            for (
                let row = section.start;
                row <= section.end;
                row++
            ) {

                const rowElement =
                    document.createElement("div");

                rowElement.className =
                    "seat-row";


                const rowNumber =
                    document.createElement("span");

                rowNumber.className =
                    "seat-row-number";

                rowNumber.textContent =
                    row;

                rowElement.appendChild(rowNumber);


                section.groups.forEach(group => {

                    const groupElement =
                        document.createElement("div");

                    groupElement.className =
                        "seat-group";


                    group.forEach(letter => {

                        const seatCode =
                            `${row}${letter}`;

                        const seat =
                            document.createElement("button");

                        seat.type = "button";

                        seat.className =
                            `seat ${section.style}`;

                        seat.textContent =
                            seatCode;


                        if (
                            occupiedSeats
                                .includes(seatCode)
                        ) {

                            seat.classList.add(
                                "occupied"
                            );

                            seat.disabled = true;

                            seat.title =
                                "Occupied";

                        } else {

                            seat.addEventListener(
                                "click",
                                () => {

                                    selectSeat(
                                        seatCode
                                    );

                                }
                            );

                        }


                        if (
                            selectedSeat === seatCode
                        ) {

                            seat.classList.add(
                                "selected"
                            );

                        }


                        groupElement.appendChild(
                            seat
                        );

                    });


                    rowElement.appendChild(
                        groupElement
                    );

                });


                sectionElement.appendChild(
                    rowElement
                );

            }


            map.appendChild(
                sectionElement
            );

        });


        updateSelectedDisplay();

    }


    /*
     * -----------------------------------------------------
     * CABIN SECTIONS
     * -----------------------------------------------------
     */

    function buildCabinSections() {

        const totalRows =
            config.rows;


        /*
         * Smaller aircraft:
         * don't create fake First Class.
         */

        if (
            cabin === "economy"
        ) {

            return [
                {
                    name: "Economy",
                    start: 1,
                    end: totalRows,
                    groups: config.groups,
                    style: "economy"
                }
            ];

        }


        if (
            cabin === "premium-economy"
        ) {

            const premiumEnd =
                Math.max(
                    4,
                    Math.round(
                        totalRows * .25
                    )
                );


            return [

                {
                    name: "Premium Economy",
                    start: 1,
                    end: premiumEnd,
                    groups: premiumGroups(),
                    style: "premium"
                },

                {
                    name: "Economy",
                    start: premiumEnd + 1,
                    end: totalRows,
                    groups: config.groups,
                    style: "economy"
                }

            ];

        }


        if (
            cabin === "business"
        ) {

            const businessEnd =
                Math.max(
                    4,
                    Math.round(
                        totalRows * .18
                    )
                );


            return [

                {
                    name: "Business Class",
                    start: 1,
                    end: businessEnd,
                    groups: businessGroups(),
                    style: "business"
                },

                {
                    name: "Economy",
                    start: businessEnd + 1,
                    end: totalRows,
                    groups: config.groups,
                    style: "economy"
                }

            ];

        }


        /*
         * First Class
         */

        const firstEnd =
            Math.max(
                3,
                Math.round(
                    totalRows * .10
                )
            );


        const businessEnd =
            Math.max(
                firstEnd + 4,
                Math.round(
                    totalRows * .20
                )
            );


        return [

            {
                name: "First Class / Suites",
                start: 1,
                end: firstEnd,
                groups: firstGroups(),
                style: "first"
            },

            {
                name: "Business Class",
                start: firstEnd + 1,
                end: businessEnd,
                groups: businessGroups(),
                style: "business"
            },

            {
                name: "Economy",
                start: businessEnd + 1,
                end: totalRows,
                groups: config.groups,
                style: "economy"
            }

        ];

    }


    /*
     * -----------------------------------------------------
     * PREMIUM GROUPS
     * -----------------------------------------------------
     */

    function premiumGroups() {

        if (
            config.groups.length === 3
        ) {

            return [
                ["A", "B"],
                ["C", "D", "E"],
                ["F", "G"]
            ];

        }


        if (
            config.groups.length === 2
        ) {

            return [
                ["A", "B"],
                ["C", "D"]
            ];

        }


        return config.groups;

    }


    /*
     * -----------------------------------------------------
     * BUSINESS GROUPS
     * -----------------------------------------------------
     */

    function businessGroups() {

        /*
         * Widebody = 1-2-1
         */

        if (
            config.groups.length === 3
        ) {

            return [
                ["A"],
                ["C", "D"],
                ["G"]
            ];

        }


        /*
         * 777 / A380
         */

        if (
            config.groups.length === 3 &&
            config.groups[1].length === 4
        ) {

            return [
                ["A"],
                ["D", "E"],
                ["K"]
            ];

        }


        /*
         * Narrowbody
         */

        return [
            ["A", "B"],
            ["C", "D"]
        ];

    }


    /*
     * -----------------------------------------------------
     * FIRST GROUPS
     * -----------------------------------------------------
     */

    function firstGroups() {

        /*
         * First / suite style
         */

        if (
            config.groups.length >= 3
        ) {

            return [
                ["A"],
                ["D"],
                ["G"]
            ];

        }


        return [
            ["A"],
            ["D"]
        ];

    }


    /*
     * -----------------------------------------------------
     * SELECT SEAT
     * -----------------------------------------------------
     */

    function selectSeat(code) {

        if (
            occupiedSeats.includes(code)
        ) {
            return;
        }


        selectedSeat = code;

        /*
         * Update visually.
         */

        document
            .querySelectorAll(".seat.selected")
            .forEach(seat => {
                seat.classList.remove(
                    "selected"
                );
            });


        const selected =
            [...document.querySelectorAll(".seat")]
                .find(
                    seat =>
                        seat.textContent === code
                );


        if (selected) {

            selected.classList.add(
                "selected"
            );

        }


        updateSelectedDisplay();

    }


    /*
     * -----------------------------------------------------
     * SELECTED DISPLAY
     * -----------------------------------------------------
     */

    function updateSelectedDisplay() {

        const display =
            document.getElementById(
                "selected-seat"
            );

        const info =
            document.getElementById(
                "selected-seat-info"
            );

        const button =
            document.getElementById(
                "continue-button"
            );


        if (!selectedSeat) {

            display.textContent = "—";

            info.textContent =
                "Select a seat from the map.";

            button.disabled = true;

            return;

        }


        display.textContent =
            selectedSeat;

        info.textContent =
            `${cabinName(cabin)} • ${aircraft}`;

        button.disabled = false;

    }


    /*
     * -----------------------------------------------------
     * CONTINUE
     * -----------------------------------------------------
     */

    document
        .getElementById("continue-button")
        .addEventListener("click", () => {

            if (!selectedSeat) {
                return;
            }


            /*
             * Save in the new booking format.
             */

            booking.seat =
                selectedSeat;

            booking.seats =
                [selectedSeat];


            /*
             * Keep selected flight
             * structure intact.
             */

            localStorage.setItem(
                "bulaAirBooking",
                JSON.stringify(booking)
            );


            /*
             * Also maintain compatibility
             * with older pages.
             */

            sessionStorage.setItem(
                "bulaAirBooking",
                JSON.stringify(booking)
            );


            window.location.href =
                "passenger-details.html";

        });


    /*
     * -----------------------------------------------------
     * BACK
     * -----------------------------------------------------
     */

    document
        .getElementById("back-button")
        .addEventListener("click", () => {

            window.location.href =
                "booking.html";

        });


    /*
     * -----------------------------------------------------
     * AIRCRAFT NAME NORMALISATION
     * -----------------------------------------------------
     */

    function normaliseAircraft(value) {

        const text =
            String(value)
                .replace(/\s+/g, " ")
                .trim();


        const aliases = {

            "A220-300":
                "Airbus A220-300",

            "A320neo":
                "Airbus A320neo",

            "A321neo":
                "Airbus A321neo",

            "A321-200":
                "Airbus A321-200",

            "A330neo":
                "Airbus A330-900",

            "A330-900neo":
                "Airbus A330-900",

            "A330-900":
                "Airbus A330-900",

            "A350-900":
                "Airbus A350-900",

            "A350-1000":
                "Airbus A350-1000",

            "A350-1000ULR":
                "Airbus A350-1000ULR",

            "777-9":
                "Boeing 777-9",

            "Boeing 777X":
                "Boeing 777-9",

            "A380-800":
                "Airbus A380-800",

            "ATR72":
                "ATR 72-600",

            "ATR 72":
                "ATR 72-600"

        };


        return aliases[text] || text;

    }


    /*
     * -----------------------------------------------------
     * CABIN NAME
     * -----------------------------------------------------
     */

    function cabinName(value) {

        const names = {

            economy:
                "Economy",

            "premium-economy":
                "Premium Economy",

            business:
                "Business Class",

            first:
                "First Class / Suites"

        };


        return names[value] ||
            "Economy";

    }


    /*
     * -----------------------------------------------------
     * OCCUPIED SEATS
     * -----------------------------------------------------
     */

    function generateOccupiedSeats(
        aircraftConfig,
        seed
    ) {

        const seats = [];

        const seedString =
            String(seed);


        let hash = 0;

        for (
            let i = 0;
            i < seedString.length;
            i++
        ) {

            hash =
                (
                    hash * 31 +
                    seedString.charCodeAt(i)
                ) >>> 0;

        }


        const letters =
            aircraftConfig.groups.flat();


        /*
         * Roughly 15% occupied.
         */

        for (
            let row = 1;
            row <= aircraftConfig.rows;
            row++
        ) {

            letters.forEach(
                (letter, index) => {

                    const value =
                        (
                            hash +
                            row * 17 +
                            index * 29
                        ) % 100;


                    if (
                        value < 15
                    ) {

                        seats.push(
                            `${row}${letter}`
                        );

                    }

                }
            );

        }


        /*
         * Don't occupy absolutely everything
         * in the first few rows.
         */

        return seats;

    }


    /*
     * -----------------------------------------------------
     * MESSAGE
     * -----------------------------------------------------
     */

    function showMessage(message) {

        const element =
            document.getElementById(
                "seat-message"
            );

        element.hidden = false;

        element.textContent =
            message;

    }


    /*
     * -----------------------------------------------------
     * HTML ESCAPING
     * -----------------------------------------------------
     */

    function escapeHtml(value) {

        return String(value)
            .replaceAll("&", "&amp;")
            .replaceAll("<", "&lt;")
            .replaceAll(">", "&gt;")
            .replaceAll('"', "&quot;")
            .replaceAll("'", "&#039;");

    }

});

</script>
